const PARSER_STRICT = 0
const PARSER_SLOPPY = 1

/* this function is used to uniquely identify ambiguous moves */
function get_disambiguator(move, moves) {
  var from = move.from
  var to = move.to
  var piece = move.piece

  var ambiguities = 0
  var same_rank = 0
  var same_file = 0

  for (var i = 0, len = moves.length; i < len; i++) {
    var ambig_from = moves[i].from
    var ambig_to = moves[i].to
    var ambig_piece = moves[i].piece

    /* if a move of the same piece type ends on the same to square, we'll
     * need to add a disambiguator to the algebraic notation
     */
    if (piece === ambig_piece && from !== ambig_from && to === ambig_to) {
      ambiguities++

      if (rank(from) === rank(ambig_from)) {
        same_rank++
      }

      if (file(from) === file(ambig_from)) {
        same_file++
      }
    }
  }

  if (ambiguities > 0) {
    /* if there exists a similar moving piece on the same rank and file as
     * the move in question, use the square as the disambiguator
     */
    if (same_rank > 0 && same_file > 0) {
      return algebraic(from)
    } else if (same_file > 0) {
      /* if the moving piece rests on the same file, use the rank symbol as the
       * disambiguator
       */
      return algebraic(from).charAt(1)
    } else {
      /* else use the file symbol */
      return algebraic(from).charAt(0)
    }
  }

  return ''
}

function infer_piece_type(san) {
  var piece_type = san.charAt(0)
  if (piece_type >= 'a' && piece_type <= 'h') {
    var matches = san.match(/[a-h]\d.*[a-h]\d/)
    if (matches) {
      return undefined
    }
    return PAWN
  }
  piece_type = piece_type.toLowerCase()
  if (piece_type === 'o') {
    return KING
  }
  return piece_type
}

// parses all of the decorators out of a SAN string
function stripped_san(move) {
  return move.replace(/=/, '').replace(/[+#]?[?!]*$/, '')
}

/*****************************************************************************
 * UTILITY FUNCTIONS
 ****************************************************************************/
function rank(i) {
  return i >> 4
}

function file(i) {
  return i & 15
}

function algebraic(i) {
  var f = file(i),
    r = rank(i)
  return 'abcdefgh'.substring(f, f + 1) + '87654321'.substring(r, r + 1)
}

function swap_color(c) {
  return c === WHITE ? BLACK : WHITE
}

function is_digit(c) {
  return '0123456789'.indexOf(c) !== -1
}

function clone(obj) {
  var dupe = obj instanceof Array ? [] : {}

  for (var property in obj) {
    if (typeof property === 'object') {
      dupe[property] = clone(obj[property])
    } else {
      dupe[property] = obj[property]
    }
  }

  return dupe
}

function trim(str) {
  return str.replace(/^\s+|\s+$/g, '')
}

/***************************************************************************
 * PUBLIC CONSTANTS
 **************************************************************************/

const BLACK = 'b'
const WHITE = 'w'

const EMPTY = -1

const PAWN = 'p'
const KNIGHT = 'n'
const BISHOP = 'b'
const ROOK = 'r'
const QUEEN = 'q'
const KING = 'k'

const SQUARES = (function () {
  /* from the ECMA-262 spec (section 12.6.4):
   * "The mechanics of enumerating the properties ... is
   * implementation dependent"
   * so: for (var sq in SQUARES) { keys.push(sq); } might not be
   * ordered correctly
   */
  var keys = []
  for (var i = SQUARE_MAP.a8; i <= SQUARE_MAP.h1; i++) {
    if (i & 0x88) {
      i += 7
      continue
    }
    keys.push(algebraic(i))
  }
  return keys
})()

const FLAGS = {
  NORMAL: 'n',
  CAPTURE: 'c',
  BIG_PAWN: 'b',
  EP_CAPTURE: 'e',
  PROMOTION: 'p',
  KSIDE_CASTLE: 'k',
  QSIDE_CASTLE: 'q',
}

const Chess = function (fen) {
  var board = new Array(128)
  var kings = { w: EMPTY, b: EMPTY }
  var turn = WHITE
  var castling = { w: 0, b: 0 }
  var ep_square = EMPTY
  var half_moves = 0
  var move_number = 1
  var history = []
  var header = {}
  var comments = {}

  /* if the user passes in a fen string, load it, else default to
   * starting position
   */
  if (typeof fen === 'undefined') {
    load(DEFAULT_POSITION)
  } else {
    load(fen)
  }

  function clear(keep_headers) {
    if (typeof keep_headers === 'undefined') {
      keep_headers = false
    }

    board = new Array(128)
    kings = { w: EMPTY, b: EMPTY }
    turn = WHITE
    castling = { w: 0, b: 0 }
    ep_square = EMPTY
    half_moves = 0
    move_number = 1
    history = []
    if (!keep_headers) header = {}
    comments = {}
    update_setup(generate_fen())
  }

  function prune_comments() {
    var reversed_history = []
    var current_comments = {}
    var copy_comment = function (fen) {
      if (fen in comments) {
        current_comments[fen] = comments[fen]
      }
    }
    while (history.length > 0) {
      reversed_history.push(undo_move())
    }
    copy_comment(generate_fen())
    while (reversed_history.length > 0) {
      make_move(reversed_history.pop())
      copy_comment(generate_fen())
    }
    comments = current_comments
  }

  function reset() {
    load(DEFAULT_POSITION)
  }

  function load(fen, keep_headers) {
    if (typeof keep_headers === 'undefined') {
      keep_headers = false
    }

    var tokens = fen.split(/\s+/)
    var position = tokens[0]
    var square = 0

    if (!validate_fen(fen).valid) {
      return false
    }

    clear(keep_headers)

    for (var i = 0; i < position.length; i++) {
      var piece = position.charAt(i)

      if (piece === '/') {
        square += 8
      } else if (is_digit(piece)) {
        square += parseInt(piece, 10)
      } else {
        var color = piece < 'a' ? WHITE : BLACK
        put({ type: piece.toLowerCase(), color: color }, algebraic(square))
        square++
      }
    }

    turn = tokens[1]

    if (tokens[2].indexOf('K') > -1) {
      castling.w |= BITS.KSIDE_CASTLE
    }
    if (tokens[2].indexOf('Q') > -1) {
      castling.w |= BITS.QSIDE_CASTLE
    }
    if (tokens[2].indexOf('k') > -1) {
      castling.b |= BITS.KSIDE_CASTLE
    }
    if (tokens[2].indexOf('q') > -1) {
      castling.b |= BITS.QSIDE_CASTLE
    }

    ep_square = tokens[3] === '-' ? EMPTY : SQUARE_MAP[tokens[3]]
    half_moves = parseInt(tokens[4], 10)
    move_number = parseInt(tokens[5], 10)

    update_setup(generate_fen())

    return true
  }

  /* TODO: this function is pretty much crap - it validates structure but
   * completely ignores content (e.g. doesn't verify that each side has a king)
   * ... we should rewrite this, and ditch the silly error_number field while
   * we're at it
   */
  function validate_fen(fen) {
    var errors = {
      0: 'No errors.',
      1: 'FEN string must contain six space-delimited fields.',
      2: '6th field (move number) must be a positive integer.',
      3: '5th field (half move counter) must be a non-negative integer.',
      4: '4th field (en-passant square) is invalid.',
      5: '3rd field (castling availability) is invalid.',
      6: '2nd field (side to move) is invalid.',
      7: "1st field (piece positions) does not contain 8 '/'-delimited rows.",
      8: '1st field (piece positions) is invalid [consecutive numbers].',
      9: '1st field (piece positions) is invalid [invalid piece].',
      10: '1st field (piece positions) is invalid [row too large].',
      11: 'Illegal en-passant square',
    }

    /* 1st criterion: 6 space-seperated fields? */
    var tokens = fen.split(/\s+/)
    if (tokens.length !== 6) {
      return { valid: false, error_number: 1, error: errors[1] }
    }

    /* 2nd criterion: move number field is a integer value > 0? */
    if (isNaN(parseInt(tokens[5])) || parseInt(tokens[5], 10) <= 0) {
      return { valid: false, error_number: 2, error: errors[2] }
    }

    /* 3rd criterion: half move counter is an integer >= 0? */
    if (isNaN(parseInt(tokens[4])) || parseInt(tokens[4], 10) < 0) {
      return { valid: false, error_number: 3, error: errors[3] }
    }

    /* 4th criterion: 4th field is a valid e.p.-string? */
    if (!/^(-|[abcdefgh][36])$/.test(tokens[3])) {
      return { valid: false, error_number: 4, error: errors[4] }
    }

    /* 5th criterion: 3th field is a valid castle-string? */
    if (!/^(KQ?k?q?|Qk?q?|kq?|q|-)$/.test(tokens[2])) {
      return { valid: false, error_number: 5, error: errors[5] }
    }

    /* 6th criterion: 2nd field is "w" (white) or "b" (black)? */
    if (!/^(w|b)$/.test(tokens[1])) {
      return { valid: false, error_number: 6, error: errors[6] }
    }

    /* 7th criterion: 1st field contains 8 rows? */
    var rows = tokens[0].split('/')
    if (rows.length !== 8) {
      return { valid: false, error_number: 7, error: errors[7] }
    }

    /* 8th criterion: every row is valid? */
    for (var i = 0; i < rows.length; i++) {
      /* check for right sum of fields AND not two numbers in succession */
      var sum_fields = 0
      var previous_was_number = false

      for (var k = 0; k < rows[i].length; k++) {
        if (!isNaN(rows[i][k])) {
          if (previous_was_number) {
            return { valid: false, error_number: 8, error: errors[8] }
          }
          sum_fields += parseInt(rows[i][k], 10)
          previous_was_number = true
        } else {
          if (!/^[prnbqkPRNBQK]$/.test(rows[i][k])) {
            return { valid: false, error_number: 9, error: errors[9] }
          }
          sum_fields += 1
          previous_was_number = false
        }
      }
      if (sum_fields !== 8) {
        return { valid: false, error_number: 10, error: errors[10] }
      }
    }

    if (
      (tokens[3][1] == '3' && tokens[1] == 'w') ||
      (tokens[3][1] == '6' && tokens[1] == 'b')
    ) {
      return { valid: false, error_number: 11, error: errors[11] }
    }

    /* everything's okay! */
    return { valid: true, error_number: 0, error: errors[0] }
  }

  function generate_fen() {
    var empty = 0
    var fen = ''

    for (var i = SQUARE_MAP.a8; i <= SQUARE_MAP.h1; i++) {
      if (board[i] == null) {
        empty++
      } else {
        if (empty > 0) {
          fen += empty
          empty = 0
        }
        var color = board[i].color
        var piece = board[i].type

        fen += color === WHITE ? piece.toUpperCase() : piece.toLowerCase()
      }

      if ((i + 1) & 0x88) {
        if (empty > 0) {
          fen += empty
        }

        if (i !== SQUARE_MAP.h1) {
          fen += '/'
        }

        empty = 0
        i += 8
      }
    }

    var cflags = ''
    if (castling[WHITE] & BITS.KSIDE_CASTLE) {
      cflags += 'K'
    }
    if (castling[WHITE] & BITS.QSIDE_CASTLE) {
      cflags += 'Q'
    }
    if (castling[BLACK] & BITS.KSIDE_CASTLE) {
      cflags += 'k'
    }
    if (castling[BLACK] & BITS.QSIDE_CASTLE) {
      cflags += 'q'
    }

    /* do we have an empty castling flag? */
    cflags = cflags || '-'
    var epflags = ep_square === EMPTY ? '-' : algebraic(ep_square)

    return [fen, turn, cflags, epflags, half_moves, move_number].join(' ')
  }

  function set_header(args) {
    for (var i = 0; i < args.length; i += 2) {
      if (typeof args[i] === 'string' && typeof args[i + 1] === 'string') {
        header[args[i]] = args[i + 1]
      }
    }
    return header
  }

  /* called when the initial board setup is changed with put() or remove().
   * modifies the SetUp and FEN properties of the header object.  if the FEN is
   * equal to the default position, the SetUp and FEN are deleted
   * the setup is only updated if history.length is zero, ie moves haven't been
   * made.
   */
  function update_setup(fen) {
    if (history.length > 0) return

    if (fen !== DEFAULT_POSITION) {
      header['SetUp'] = '1'
      header['FEN'] = fen
    } else {
      delete header['SetUp']
      delete header['FEN']
    }
  }

  function get(square) {
    var piece = board[SQUARE_MAP[square]]
    return piece ? { type: piece.type, color: piece.color } : null
  }

  function put(piece, square) {
    /* check for valid piece object */
    if (!('type' in piece && 'color' in piece)) {
      return false
    }

    /* check for piece */
    if (SYMBOLS.indexOf(piece.type.toLowerCase()) === -1) {
      return false
    }

    /* check for valid square */
    if (!(square in SQUARE_MAP)) {
      return false
    }

    var sq = SQUARE_MAP[square]

    /* don't let the user place more than one king */
    if (
      piece.type == KING &&
      !(kings[piece.color] == EMPTY || kings[piece.color] == sq)
    ) {
      return false
    }

    board[sq] = { type: piece.type, color: piece.color }
    if (piece.type === KING) {
      kings[piece.color] = sq
    }

    update_setup(generate_fen())

    return true
  }

  function remove(square) {
    var piece = get(square)
    board[SQUARE_MAP[square]] = null
    if (piece && piece.type === KING) {
      kings[piece.color] = EMPTY
    }

    update_setup(generate_fen())

    return piece
  }

  function build_move(board, from, to, flags, promotion) {
    var move = {
      color: turn,
      from: from,
      to: to,
      flags: flags,
      piece: board[from].type,
    }

    if (promotion) {
      move.flags |= BITS.PROMOTION
      move.promotion = promotion
    }

    if (board[to]) {
      move.captured = board[to].type
    } else if (flags & BITS.EP_CAPTURE) {
      move.captured = PAWN
    }
    return move
  }

  function generate_moves(options) {
    function add_move(board, moves, from, to, flags) {
      /* if pawn promotion */
      if (
        board[from].type === PAWN &&
        (rank(to) === RANK_8 || rank(to) === RANK_1)
      ) {
        var pieces = [QUEEN, ROOK, BISHOP, KNIGHT]
        for (var i = 0, len = pieces.length; i < len; i++) {
          moves.push(build_move(board, from, to, flags, pieces[i]))
        }
      } else {
        moves.push(build_move(board, from, to, flags))
      }
    }

    var moves = []
    var us = turn
    var them = swap_color(us)
    var second_rank = { b: RANK_7, w: RANK_2 }

    var first_sq = SQUARE_MAP.a8
    var last_sq = SQUARE_MAP.h1
    var single_square = false

    /* do we want legal moves? */
    var legal =
      typeof options !== 'undefined' && 'legal' in options
        ? options.legal
        : true

    var piece_type =
      typeof options !== 'undefined' &&
      'piece' in options &&
      typeof options.piece === 'string'
        ? options.piece.toLowerCase()
        : true

    /* are we generating moves for a single square? */
    if (typeof options !== 'undefined' && 'square' in options) {
      if (options.square in SQUARE_MAP) {
        first_sq = last_sq = SQUARE_MAP[options.square]
        single_square = true
      } else {
        /* invalid square */
        return []
      }
    }

    for (var i = first_sq; i <= last_sq; i++) {
      /* did we run off the end of the board */
      if (i & 0x88) {
        i += 7
        continue
      }

      var piece = board[i]
      if (piece == null || piece.color !== us) {
        continue
      }

      if (piece.type === PAWN && (piece_type === true || piece_type === PAWN)) {
        /* single square, non-capturing */
        var square = i + PAWN_OFFSETS[us][0]
        if (board[square] == null) {
          add_move(board, moves, i, square, BITS.NORMAL)

          /* double square */
          var square = i + PAWN_OFFSETS[us][1]
          if (second_rank[us] === rank(i) && board[square] == null) {
            add_move(board, moves, i, square, BITS.BIG_PAWN)
          }
        }

        /* pawn captures */
        for (j = 2; j < 4; j++) {
          var square = i + PAWN_OFFSETS[us][j]
          if (square & 0x88) continue

          if (board[square] != null && board[square].color === them) {
            add_move(board, moves, i, square, BITS.CAPTURE)
          } else if (square === ep_square) {
            add_move(board, moves, i, ep_square, BITS.EP_CAPTURE)
          }
        }
      } else if (piece_type === true || piece_type === piece.type) {
        for (var j = 0, len = PIECE_OFFSETS[piece.type].length; j < len; j++) {
          var offset = PIECE_OFFSETS[piece.type][j]
          var square = i

          while (true) {
            square += offset
            if (square & 0x88) break

            if (board[square] == null) {
              add_move(board, moves, i, square, BITS.NORMAL)
            } else {
              if (board[square].color === us) break
              add_move(board, moves, i, square, BITS.CAPTURE)
              break
            }

            /* break, if knight or king */
            if (piece.type === 'n' || piece.type === 'k') break
          }
        }
      }
    }

    /* check for castling if: a) we're generating all moves, or b) we're doing
     * single square move generation on the king's square
     */
    if (piece_type === true || piece_type === KING) {
      if (!single_square || last_sq === kings[us]) {
        /* king-side castling */
        if (castling[us] & BITS.KSIDE_CASTLE) {
          var castling_from = kings[us]
          var castling_to = castling_from + 2

          if (
            board[castling_from + 1] == null &&
            board[castling_to] == null &&
            !attacked(them, kings[us]) &&
            !attacked(them, castling_from + 1) &&
            !attacked(them, castling_to)
          ) {
            add_move(board, moves, kings[us], castling_to, BITS.KSIDE_CASTLE)
          }
        }

        /* queen-side castling */
        if (castling[us] & BITS.QSIDE_CASTLE) {
          var castling_from = kings[us]
          var castling_to = castling_from - 2

          if (
            board[castling_from - 1] == null &&
            board[castling_from - 2] == null &&
            board[castling_from - 3] == null &&
            !attacked(them, kings[us]) &&
            !attacked(them, castling_from - 1) &&
            !attacked(them, castling_to)
          ) {
            add_move(board, moves, kings[us], castling_to, BITS.QSIDE_CASTLE)
          }
        }
      }
    }

    /* return all pseudo-legal moves (this includes moves that allow the king
     * to be captured)
     */
    if (!legal) {
      return moves
    }

    /* filter out illegal moves */
    var legal_moves = []
    for (var i = 0, len = moves.length; i < len; i++) {
      make_move(moves[i])
      if (!king_attacked(us)) {
        legal_moves.push(moves[i])
      }
      undo_move()
    }

    return legal_moves
  }

  /* convert a move from 0x88 coordinates to Standard Algebraic Notation
   * (SAN)
   *
   * @param {boolean} sloppy Use the sloppy SAN generator to work around over
   * disambiguation bugs in Fritz and Chessbase.  See below:
   *
   * r1bqkbnr/ppp2ppp/2n5/1B1pP3/4P3/8/PPPP2PP/RNBQK1NR b KQkq - 2 4
   * 4. ... Nge7 is overly disambiguated because the knight on c6 is pinned
   * 4. ... Ne7 is technically the valid SAN
   */
  function move_to_san(move, moves) {
    var output = ''

    if (move.flags & BITS.KSIDE_CASTLE) {
      output = 'O-O'
    } else if (move.flags & BITS.QSIDE_CASTLE) {
      output = 'O-O-O'
    } else {
      if (move.piece !== PAWN) {
        var disambiguator = get_disambiguator(move, moves)
        output += move.piece.toUpperCase() + disambiguator
      }

      if (move.flags & (BITS.CAPTURE | BITS.EP_CAPTURE)) {
        if (move.piece === PAWN) {
          output += algebraic(move.from)[0]
        }
        output += 'x'
      }

      output += algebraic(move.to)

      if (move.flags & BITS.PROMOTION) {
        output += '=' + move.promotion.toUpperCase()
      }
    }

    make_move(move)
    if (in_check()) {
      if (in_checkmate()) {
        output += '#'
      } else {
        output += '+'
      }
    }
    undo_move()

    return output
  }

  function attacked(color, square) {
    for (var i = SQUARE_MAP.a8; i <= SQUARE_MAP.h1; i++) {
      /* did we run off the end of the board */
      if (i & 0x88) {
        i += 7
        continue
      }

      /* if empty square or wrong color */
      if (board[i] == null || board[i].color !== color) continue

      var piece = board[i]
      var difference = i - square
      var index = difference + 119

      if (ATTACKS[index] & (1 << SHIFTS[piece.type])) {
        if (piece.type === PAWN) {
          if (difference > 0) {
            if (piece.color === WHITE) return true
          } else {
            if (piece.color === BLACK) return true
          }
          continue
        }

        /* if the piece is a knight or a king */
        if (piece.type === 'n' || piece.type === 'k') return true

        var offset = RAYS[index]
        var j = i + offset

        var blocked = false
        while (j !== square) {
          if (board[j] != null) {
            blocked = true
            break
          }
          j += offset
        }

        if (!blocked) return true
      }
    }

    return false
  }

  function king_attacked(color) {
    return attacked(swap_color(color), kings[color])
  }

  function in_check() {
    return king_attacked(turn)
  }

  function in_checkmate() {
    return in_check() && generate_moves().length === 0
  }

  function in_stalemate() {
    return !in_check() && generate_moves().length === 0
  }

  function insufficient_material() {
    var pieces = {}
    var bishops = []
    var num_pieces = 0
    var sq_color = 0

    for (var i = SQUARE_MAP.a8; i <= SQUARE_MAP.h1; i++) {
      sq_color = (sq_color + 1) % 2
      if (i & 0x88) {
        i += 7
        continue
      }

      var piece = board[i]
      if (piece) {
        pieces[piece.type] = piece.type in pieces ? pieces[piece.type] + 1 : 1
        if (piece.type === BISHOP) {
          bishops.push(sq_color)
        }
        num_pieces++
      }
    }

    /* k vs. k */
    if (num_pieces === 2) {
      return true
    } else if (
      /* k vs. kn .... or .... k vs. kb */
      num_pieces === 3 &&
      (pieces[BISHOP] === 1 || pieces[KNIGHT] === 1)
    ) {
      return true
    } else if (num_pieces === pieces[BISHOP] + 2) {
      /* kb vs. kb where any number of bishops are all on the same color */
      var sum = 0
      var len = bishops.length
      for (var i = 0; i < len; i++) {
        sum += bishops[i]
      }
      if (sum === 0 || sum === len) {
        return true
      }
    }

    return false
  }

  function in_threefold_repetition() {
    /* TODO: while this function is fine for casual use, a better
     * implementation would use a Zobrist key (instead of FEN). the
     * Zobrist key would be maintained in the make_move/undo_move functions,
     * avoiding the costly that we do below.
     */
    var moves = []
    var positions = {}
    var repetition = false

    while (true) {
      var move = undo_move()
      if (!move) break
      moves.push(move)
    }

    while (true) {
      /* remove the last two fields in the FEN string, they're not needed
       * when checking for draw by rep */
      var fen = generate_fen().split(' ').slice(0, 4).join(' ')

      /* has the position occurred three or move times */
      positions[fen] = fen in positions ? positions[fen] + 1 : 1
      if (positions[fen] >= 3) {
        repetition = true
      }

      if (!moves.length) {
        break
      }
      make_move(moves.pop())
    }

    return repetition
  }

  function push(move) {
    history.push({
      move: move,
      kings: { b: kings.b, w: kings.w },
      turn: turn,
      castling: { b: castling.b, w: castling.w },
      ep_square: ep_square,
      half_moves: half_moves,
      move_number: move_number,
    })
  }

  function make_move(move) {
    var us = turn
    var them = swap_color(us)
    push(move)

    board[move.to] = board[move.from]
    board[move.from] = null

    /* if ep capture, remove the captured pawn */
    if (move.flags & BITS.EP_CAPTURE) {
      if (turn === BLACK) {
        board[move.to - 16] = null
      } else {
        board[move.to + 16] = null
      }
    }

    /* if pawn promotion, replace with new piece */
    if (move.flags & BITS.PROMOTION) {
      board[move.to] = { type: move.promotion, color: us }
    }

    /* if we moved the king */
    if (board[move.to].type === KING) {
      kings[board[move.to].color] = move.to

      /* if we castled, move the rook next to the king */
      if (move.flags & BITS.KSIDE_CASTLE) {
        var castling_to = move.to - 1
        var castling_from = move.to + 1
        board[castling_to] = board[castling_from]
        board[castling_from] = null
      } else if (move.flags & BITS.QSIDE_CASTLE) {
        var castling_to = move.to + 1
        var castling_from = move.to - 2
        board[castling_to] = board[castling_from]
        board[castling_from] = null
      }

      /* turn off castling */
      castling[us] = ''
    }

    /* turn off castling if we move a rook */
    if (castling[us]) {
      for (var i = 0, len = ROOKS[us].length; i < len; i++) {
        if (
          move.from === ROOKS[us][i].square &&
          castling[us] & ROOKS[us][i].flag
        ) {
          castling[us] ^= ROOKS[us][i].flag
          break
        }
      }
    }

    /* turn off castling if we capture a rook */
    if (castling[them]) {
      for (var i = 0, len = ROOKS[them].length; i < len; i++) {
        if (
          move.to === ROOKS[them][i].square &&
          castling[them] & ROOKS[them][i].flag
        ) {
          castling[them] ^= ROOKS[them][i].flag
          break
        }
      }
    }

    /* if big pawn move, update the en passant square */
    if (move.flags & BITS.BIG_PAWN) {
      if (turn === 'b') {
        ep_square = move.to - 16
      } else {
        ep_square = move.to + 16
      }
    } else {
      ep_square = EMPTY
    }

    /* reset the 50 move counter if a pawn is moved or a piece is captured */
    if (move.piece === PAWN) {
      half_moves = 0
    } else if (move.flags & (BITS.CAPTURE | BITS.EP_CAPTURE)) {
      half_moves = 0
    } else {
      half_moves++
    }

    if (turn === BLACK) {
      move_number++
    }
    turn = swap_color(turn)
  }

  function undo_move() {
    var old = history.pop()
    if (old == null) {
      return null
    }

    var move = old.move
    kings = old.kings
    turn = old.turn
    castling = old.castling
    ep_square = old.ep_square
    half_moves = old.half_moves
    move_number = old.move_number

    var us = turn
    var them = swap_color(turn)

    board[move.from] = board[move.to]
    board[move.from].type = move.piece // to undo any promotions
    board[move.to] = null

    if (move.flags & BITS.CAPTURE) {
      board[move.to] = { type: move.captured, color: them }
    } else if (move.flags & BITS.EP_CAPTURE) {
      var index
      if (us === BLACK) {
        index = move.to - 16
      } else {
        index = move.to + 16
      }
      board[index] = { type: PAWN, color: them }
    }

    if (move.flags & (BITS.KSIDE_CASTLE | BITS.QSIDE_CASTLE)) {
      var castling_to, castling_from
      if (move.flags & BITS.KSIDE_CASTLE) {
        castling_to = move.to + 1
        castling_from = move.to - 1
      } else if (move.flags & BITS.QSIDE_CASTLE) {
        castling_to = move.to - 2
        castling_from = move.to + 1
      }

      board[castling_to] = board[castling_from]
      board[castling_from] = null
    }

    return move
  }

  // convert a move from Standard Algebraic Notation (SAN) to 0x88 coordinates
  function move_from_san(move, sloppy) {
    // strip off any move decorations: e.g Nf3+?! becomes Nf3
    var clean_move = stripped_san(move)

    // the move parsers is a 2-step state
    for (var parser = 0; parser < 2; parser++) {
      if (parser == PARSER_SLOPPY) {
        // only run the sloppy parse if explicitly requested
        if (!sloppy) {
          return null
        }

        // The sloppy parser allows the user to parse non-standard chess
        // notations. This parser is opt-in (by specifying the
        // '{ sloppy: true }' setting) and is only run after the Standard
        // Algebraic Notation (SAN) parser has failed.
        //
        // When running the sloppy parser, we'll run a regex to grab the piece,
        // the to/from square, and an optional promotion piece. This regex will
        // parse common non-standard notation like: Pe2-e4, Rc1c4, Qf3xf7,
        // f7f8q, b1c3

        // NOTE: Some positions and moves may be ambiguous when using the
        // sloppy parser. For example, in this position:
        // 6k1/8/8/B7/8/8/8/BN4K1 w - - 0 1, the move b1c3 may be interpreted
        // as Nc3 or B1c3 (a disambiguated bishop move). In these cases, the
        // sloppy parser will default to the most most basic interpretation
        // (which is b1c3 parsing to Nc3).

        // FIXME: these var's are hoisted into function scope, this will need
        // to change when switching to const/let

        var overly_disambiguated = false

        var matches = clean_move.match(
          /([pnbrqkPNBRQK])?([a-h][1-8])x?-?([a-h][1-8])([qrbnQRBN])?/
        )
        if (matches) {
          var piece = matches[1]
          var from = matches[2]
          var to = matches[3]
          var promotion = matches[4]

          if (from.length == 1) {
            overly_disambiguated = true
          }
        } else {
          // The [a-h]?[1-8]? portion of the regex below handles moves that may
          // be overly disambiguated (e.g. Nge7 is unnecessary and non-standard
          // when there is one legal knight move to e7). In this case, the value
          // of 'from' variable will be a rank or file, not a square.
          var matches = clean_move.match(
            /([pnbrqkPNBRQK])?([a-h]?[1-8]?)x?-?([a-h][1-8])([qrbnQRBN])?/
          )

          if (matches) {
            var piece = matches[1]
            var from = matches[2]
            var to = matches[3]
            var promotion = matches[4]

            if (from.length == 1) {
              var overly_disambiguated = true
            }
          }
        }
      }

      var piece_type = infer_piece_type(clean_move)
      var moves = generate_moves({
        legal: true,
        piece: piece ? piece : piece_type,
      })

      for (var i = 0, len = moves.length; i < len; i++) {
        switch (parser) {
          case PARSER_STRICT: {
            if (clean_move === stripped_san(move_to_san(moves[i], moves))) {
              return moves[i]
            }
            break
          }
          case PARSER_SLOPPY: {
            if (matches) {
              // hand-compare move properties with the results from our sloppy
              // regex
              if (
                (!piece || piece.toLowerCase() == moves[i].piece) &&
                SQUARE_MAP[from] == moves[i].from &&
                SQUARE_MAP[to] == moves[i].to &&
                (!promotion || promotion.toLowerCase() == moves[i].promotion)
              ) {
                return moves[i]
              } else if (overly_disambiguated) {
                // SPECIAL CASE: we parsed a move string that may have an
                // unneeded rank/file disambiguator (e.g. Nge7).  The 'from'
                // variable will
                var square = algebraic(moves[i].from)
                if (
                  (!piece || piece.toLowerCase() == moves[i].piece) &&
                  SQUARE_MAP[to] == moves[i].to &&
                  (from == square[0] || from == square[1]) &&
                  (!promotion || promotion.toLowerCase() == moves[i].promotion)
                ) {
                  return moves[i]
                }
              }
            }
          }
        }
      }
    }

    return null
  }

  /* pretty = external move object */
  function make_pretty(ugly_move) {
    var move = clone(ugly_move)
    move.san = move_to_san(move, generate_moves({ legal: true }))
    move.to = algebraic(move.to)
    move.from = algebraic(move.from)

    var flags = ''

    for (var flag in BITS) {
      if (BITS[flag] & move.flags) {
        flags += FLAGS[flag]
      }
    }
    move.flags = flags

    return move
  }

  /*****************************************************************************
   * DEBUGGING UTILITIES
   ****************************************************************************/
  function perft(depth) {
    var moves = generate_moves({ legal: false })
    var nodes = 0
    var color = turn

    for (var i = 0, len = moves.length; i < len; i++) {
      make_move(moves[i])
      if (!king_attacked(color)) {
        if (depth - 1 > 0) {
          var child_nodes = perft(depth - 1)
          nodes += child_nodes
        } else {
          nodes++
        }
      }
      undo_move()
    }

    return nodes
  }

  return {
    /***************************************************************************
     * PUBLIC API
     **************************************************************************/
    load: function (fen) {
      return load(fen)
    },

    reset: function () {
      return reset()
    },

    moves: function (options) {
      /* The internal representation of a chess move is in 0x88 format, and
       * not meant to be human-readable.  The code below converts the 0x88
       * square coordinates to algebraic coordinates.  It also prunes an
       * unnecessary move keys resulting from a verbose call.
       */

      var ugly_moves = generate_moves(options)
      var moves = []

      for (var i = 0, len = ugly_moves.length; i < len; i++) {
        /* does the user want a full move object (most likely not), or just
         * SAN
         */
        if (
          typeof options !== 'undefined' &&
          'verbose' in options &&
          options.verbose
        ) {
          moves.push(make_pretty(ugly_moves[i]))
        } else {
          moves.push(
            move_to_san(ugly_moves[i], generate_moves({ legal: true }))
          )
        }
      }

      return moves
    },

    in_check: function () {
      return in_check()
    },

    in_checkmate: function () {
      return in_checkmate()
    },

    in_stalemate: function () {
      return in_stalemate()
    },

    in_draw: function () {
      return (
        half_moves >= 100 ||
        in_stalemate() ||
        insufficient_material() ||
        in_threefold_repetition()
      )
    },

    insufficient_material: function () {
      return insufficient_material()
    },

    in_threefold_repetition: function () {
      return in_threefold_repetition()
    },

    game_over: function () {
      return (
        half_moves >= 100 ||
        in_checkmate() ||
        in_stalemate() ||
        insufficient_material() ||
        in_threefold_repetition()
      )
    },

    validate_fen: function (fen) {
      return validate_fen(fen)
    },

    fen: function () {
      return generate_fen()
    },

    board: function () {
      var output = [],
        row = []

      for (var i = SQUARE_MAP.a8; i <= SQUARE_MAP.h1; i++) {
        if (board[i] == null) {
          row.push(null)
        } else {
          row.push({
            square: algebraic(i),
            type: board[i].type,
            color: board[i].color,
          })
        }
        if ((i + 1) & 0x88) {
          output.push(row)
          row = []
          i += 8
        }
      }

      return output
    },

    pgn: function (options) {
      /* using the specification from http://www.chessclub.com/help/PGN-spec
       * example for html usage: .pgn({ max_width: 72, newline_char: "<br />" })
       */
      var newline =
        typeof options === 'object' && typeof options.newline_char === 'string'
          ? options.newline_char
          : '\n'
      var max_width =
        typeof options === 'object' && typeof options.max_width === 'number'
          ? options.max_width
          : 0
      var result = []
      var header_exists = false

      /* add the PGN header information */
      for (var i in header) {
        /* TODO: order of enumerated properties in header object is not
         * guaranteed, see ECMA-262 spec (section 12.6.4)
         */
        result.push('[' + i + ' "' + header[i] + '"]' + newline)
        header_exists = true
      }

      if (header_exists && history.length) {
        result.push(newline)
      }

      var append_comment = function (move_string) {
        var comment = comments[generate_fen()]
        if (typeof comment !== 'undefined') {
          var delimiter = move_string.length > 0 ? ' ' : ''
          move_string = `${move_string}${delimiter}{${comment}}`
        }
        return move_string
      }

      /* pop all of history onto reversed_history */
      var reversed_history = []
      while (history.length > 0) {
        reversed_history.push(undo_move())
      }

      var moves = []
      var move_string = ''

      /* special case of a commented starting position with no moves */
      if (reversed_history.length === 0) {
        moves.push(append_comment(''))
      }

      /* build the list of moves.  a move_string looks like: "3. e3 e6" */
      while (reversed_history.length > 0) {
        move_string = append_comment(move_string)
        var move = reversed_history.pop()

        /* if the position started with black to move, start PGN with #. ... */
        if (!history.length && move.color === 'b') {
          const prefix = `${move_number}. ...`
          /* is there a comment preceding the first move? */
          move_string = move_string ? `${move_string} ${prefix}` : prefix
        } else if (move.color === 'w') {
          /* store the previous generated move_string if we have one */
          if (move_string.length) {
            moves.push(move_string)
          }
          move_string = move_number + '.'
        }

        move_string =
          move_string + ' ' + move_to_san(move, generate_moves({ legal: true }))
        make_move(move)
      }

      /* are there any other leftover moves? */
      if (move_string.length) {
        moves.push(append_comment(move_string))
      }

      /* is there a result? */
      if (typeof header.Result !== 'undefined') {
        moves.push(header.Result)
      }

      /* history should be back to what it was before we started generating PGN,
       * so join together moves
       */
      if (max_width === 0) {
        return result.join('') + moves.join(' ')
      }

      var strip = function () {
        if (result.length > 0 && result[result.length - 1] === ' ') {
          result.pop()
          return true
        }
        return false
      }

      /* NB: this does not preserve comment whitespace. */
      var wrap_comment = function (width, move) {
        for (var token of move.split(' ')) {
          if (!token) {
            continue
          }
          if (width + token.length > max_width) {
            while (strip()) {
              width--
            }
            result.push(newline)
            width = 0
          }
          result.push(token)
          width += token.length
          result.push(' ')
          width++
        }
        if (strip()) {
          width--
        }
        return width
      }

      /* wrap the PGN output at max_width */
      var current_width = 0
      for (var i = 0; i < moves.length; i++) {
        if (current_width + moves[i].length > max_width) {
          if (moves[i].includes('{')) {
            current_width = wrap_comment(current_width, moves[i])
            continue
          }
        }
        /* if the current move will push past max_width */
        if (current_width + moves[i].length > max_width && i !== 0) {
          /* don't end the line with whitespace */
          if (result[result.length - 1] === ' ') {
            result.pop()
          }

          result.push(newline)
          current_width = 0
        } else if (i !== 0) {
          result.push(' ')
          current_width++
        }
        result.push(moves[i])
        current_width += moves[i].length
      }

      return result.join('')
    },

    load_pgn: function (pgn, options) {
      // allow the user to specify the sloppy move parser to work around over
      // disambiguation bugs in Fritz and Chessbase
      var sloppy =
        typeof options !== 'undefined' && 'sloppy' in options
          ? options.sloppy
          : false

      function mask(str) {
        return str.replace(/\\/g, '\\')
      }

      function parse_pgn_header(header, options) {
        var newline_char =
          typeof options === 'object' &&
          typeof options.newline_char === 'string'
            ? options.newline_char
            : '\r?\n'
        var header_obj = {}
        var headers = header.split(new RegExp(mask(newline_char)))
        var key = ''
        var value = ''

        for (var i = 0; i < headers.length; i++) {
          var regex = /^\s*\[([A-Za-z]+)\s*"(.*)"\s*\]\s*$/
          key = headers[i].replace(regex, '$1')
          value = headers[i].replace(regex, '$2')
          if (trim(key).length > 0) {
            header_obj[key] = value
          }
        }

        return header_obj
      }

      // strip whitespace from head/tail of PGN block
      pgn = pgn.trim()

      var newline_char =
        typeof options === 'object' && typeof options.newline_char === 'string'
          ? options.newline_char
          : '\r?\n'

      // RegExp to split header. Takes advantage of the fact that header and movetext
      // will always have a blank line between them (ie, two newline_char's).
      // With default newline_char, will equal: /^(\[((?:\r?\n)|.)*\])(?:\s*\r?\n){2}/
      var header_regex = new RegExp(
        '^(\\[((?:' +
          mask(newline_char) +
          ')|.)*\\])' +
          '(?:\\s*' +
          mask(newline_char) +
          '){2}'
      )

      // If no header given, begin with moves.
      var header_string = header_regex.test(pgn)
        ? header_regex.exec(pgn)[1]
        : ''

      // Put the board in the starting position
      reset()

      /* parse PGN header */
      var headers = parse_pgn_header(header_string, options)
      var fen = ''

      for (var key in headers) {
        // check to see user is including fen (possibly with wrong tag case)
        if (key.toLowerCase() === 'fen') {
          fen = headers[key]
        }
        set_header([key, headers[key]])
      }

      /* sloppy parser should attempt to load a fen tag, even if it's
       * the wrong case and doesn't include a corresponding [SetUp "1"] tag */
      if (sloppy) {
        if (fen) {
          if (!load(fen, true)) {
            return false
          }
        }
      } else {
        /* strict parser - load the starting position indicated by [Setup '1']
         * and [FEN position] */
        if (headers['SetUp'] === '1') {
          if (!('FEN' in headers && load(headers['FEN'], true))) {
            // second argument to load: don't clear the headers
            return false
          }
        }
      }

      /* NB: the regexes below that delete move numbers, recursive
       * annotations, and numeric annotation glyphs may also match
       * text in comments. To prevent this, we transform comments
       * by hex-encoding them in place and decoding them again after
       * the other tokens have been deleted.
       *
       * While the spec states that PGN files should be ASCII encoded,
       * we use {en,de}codeURIComponent here to support arbitrary UTF8
       * as a convenience for modern users */

      var to_hex = function (string) {
        return Array.from(string)
          .map(function (c) {
            /* encodeURI doesn't transform most ASCII characters,
             * so we handle these ourselves */
            return c.charCodeAt(0) < 128
              ? c.charCodeAt(0).toString(16)
              : encodeURIComponent(c).replace(/\%/g, '').toLowerCase()
          })
          .join('')
      }

      var from_hex = function (string) {
        return string.length == 0
          ? ''
          : decodeURIComponent('%' + string.match(/.{1,2}/g).join('%'))
      }

      var encode_comment = function (string) {
        string = string.replace(new RegExp(mask(newline_char), 'g'), ' ')
        return `{${to_hex(string.slice(1, string.length - 1))}}`
      }

      var decode_comment = function (string) {
        if (string.startsWith('{') && string.endsWith('}')) {
          return from_hex(string.slice(1, string.length - 1))
        }
      }

      /* delete header to get the moves */
      var ms = pgn
        .replace(header_string, '')
        .replace(
          /* encode comments so they don't get deleted below */
          new RegExp(`(\{[^}]*\})+?|;([^${mask(newline_char)}]*)`, 'g'),
          function (match, bracket, semicolon) {
            return bracket !== undefined
              ? encode_comment(bracket)
              : ' ' + encode_comment(`{${semicolon.slice(1)}}`)
          }
        )
        .replace(new RegExp(mask(newline_char), 'g'), ' ')

      /* delete recursive annotation variations */
      var rav_regex = /(\([^\(\)]+\))+?/g
      while (rav_regex.test(ms)) {
        ms = ms.replace(rav_regex, '')
      }

      /* delete move numbers */
      ms = ms.replace(/\d+\.(\.\.)?/g, '')

      /* delete ... indicating black to move */
      ms = ms.replace(/\.\.\./g, '')

      /* delete numeric annotation glyphs */
      ms = ms.replace(/\$\d+/g, '')

      /* trim and get array of moves */
      var moves = trim(ms).split(new RegExp(/\s+/))

      /* delete empty entries */
      moves = moves.join(',').replace(/,,+/g, ',').split(',')
      var move = ''

      var result = ''

      for (var half_move = 0; half_move < moves.length; half_move++) {
        var comment = decode_comment(moves[half_move])
        if (comment !== undefined) {
          comments[generate_fen()] = comment
          continue
        }

        move = move_from_san(moves[half_move], sloppy)

        /* invalid move */
        if (move == null) {
          /* was the move an end of game marker */
          if (TERMINATION_MARKERS.indexOf(moves[half_move]) > -1) {
            result = moves[half_move]
          } else {
            return false
          }
        } else {
          /* reset the end of game marker if making a valid move */
          result = ''
          make_move(move)
        }
      }

      /* Per section 8.2.6 of the PGN spec, the Result tag pair must match
       * match the termination marker. Only do this when headers are present,
       * but the result tag is missing
       */
      if (result && Object.keys(header).length && !header['Result']) {
        set_header(['Result', result])
      }

      return true
    },

    header: function () {
      return set_header(arguments)
    },

    turn: function () {
      return turn
    },

    move: function (move, options) {
      /* The move function can be called with in the following parameters:
       *
       * .move('Nxb7')      <- where 'move' is a case-sensitive SAN string
       *
       * .move({ from: 'h7', <- where the 'move' is a move object (additional
       *         to :'h8',      fields are ignored)
       *         promotion: 'q',
       *      })
       */

      // allow the user to specify the sloppy move parser to work around over
      // disambiguation bugs in Fritz and Chessbase
      var sloppy =
        typeof options !== 'undefined' && 'sloppy' in options
          ? options.sloppy
          : false

      var move_obj = null

      if (typeof move === 'string') {
        move_obj = move_from_san(move, sloppy)
      } else if (typeof move === 'object') {
        var moves = generate_moves()

        /* convert the pretty move object to an ugly move object */
        for (var i = 0, len = moves.length; i < len; i++) {
          if (
            move.from === algebraic(moves[i].from) &&
            move.to === algebraic(moves[i].to) &&
            (!('promotion' in moves[i]) ||
              move.promotion === moves[i].promotion)
          ) {
            move_obj = moves[i]
            break
          }
        }
      }

      /* failed to find move */
      if (!move_obj) {
        return null
      }

      /* need to make a copy of move because we can't generate SAN after the
       * move is made
       */
      var pretty_move = make_pretty(move_obj)

      make_move(move_obj)

      return pretty_move
    },

    undo: function () {
      var move = undo_move()
      return move ? make_pretty(move) : null
    },

    clear: function () {
      return clear()
    },

    put: function (piece, square) {
      return put(piece, square)
    },

    get: function (square) {
      return get(square)
    },

    ascii() {
      var s = '   +------------------------+\n'
      for (var i = SQUARE_MAP.a8; i <= SQUARE_MAP.h1; i++) {
        /* display the rank */
        if (file(i) === 0) {
          s += ' ' + '87654321'[rank(i)] + ' |'
        }

        /* empty piece */
        if (board[i] == null) {
          s += ' . '
        } else {
          var piece = board[i].type
          var color = board[i].color
          var symbol =
            color === WHITE ? piece.toUpperCase() : piece.toLowerCase()
          s += ' ' + symbol + ' '
        }

        if ((i + 1) & 0x88) {
          s += '|\n'
          i += 8
        }
      }
      s += '   +------------------------+\n'
      s += '     a  b  c  d  e  f  g  h'

      return s
    },

    remove: function (square) {
      return remove(square)
    },

    perft: function (depth) {
      return perft(depth)
    },

    square_color: function (square) {
      if (square in SQUARE_MAP) {
        var sq_0x88 = SQUARE_MAP[square]
        return (rank(sq_0x88) + file(sq_0x88)) % 2 === 0 ? 'light' : 'dark'
      }

      return null
    },

    history: function (options) {
      var reversed_history = []
      var move_history = []
      var verbose =
        typeof options !== 'undefined' &&
        'verbose' in options &&
        options.verbose

      while (history.length > 0) {
        reversed_history.push(undo_move())
      }

      while (reversed_history.length > 0) {
        var move = reversed_history.pop()
        if (verbose) {
          move_history.push(make_pretty(move))
        } else {
          move_history.push(move_to_san(move, generate_moves({ legal: true })))
        }
        make_move(move)
      }

      return move_history
    },

    get_comment: function () {
      return comments[generate_fen()]
    },

    set_comment: function (comment) {
      comments[generate_fen()] = comment.replace('{', '[').replace('}', ']')
    },

    delete_comment: function () {
      var comment = comments[generate_fen()]
      delete comments[generate_fen()]
      return comment
    },

    get_comments: function () {
      prune_comments()
      return Object.keys(comments).map(function (fen) {
        return { fen: fen, comment: comments[fen] }
      })
    },

    delete_comments: function () {
      prune_comments()
      return Object.keys(comments).map(function (fen) {
        var comment = comments[fen]
        delete comments[fen]
        return { fen: fen, comment: comment }
      })
    },
  }
}

</script>
<style>
  :root{
    --bg:#141b2e;
    --panel:#1d2740;
    --panel-2:#26324f;
    --ink:#eef2fb;
    --muted:#9aa8c7;
    --line:#33415f;
    --accent:#5b8def;
    --accent-soft:#2f4272;
    --light:#f0d9b5;
    --dark:#b58863;
    --sel:#f6eb6b;
    --move-dot:rgba(0,0,0,.22);
    --last:rgba(155,199,0,.41);
    --check:#e5484d;
    --good:#3fb27f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    display:flex;flex-direction:column;align-items:center;
    min-height:100dvh;padding:12px;gap:12px;
    overflow-x:hidden;
  }
  .wrap{width:100%;max-width:460px;display:flex;flex-direction:column;gap:12px}

  /* Top status bar */
  .status{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:12px 14px;display:flex;align-items:center;gap:10px;min-height:52px;
  }
  .status .dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
  .status.think .dot{background:var(--accent);animation:pulse 1s infinite}
  .status.over .dot{background:var(--good)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .status .msg{font-size:15px;font-weight:600;flex:1}
  .status .sub{font-size:12px;color:var(--muted);font-weight:500}

  /* Captured pieces row */
  .caprow{display:flex;justify-content:space-between;align-items:center;min-height:22px;padding:0 2px;gap:1px}
  .caprow .cap{display:inline-block;width:20px;height:20px;background-size:contain;background-repeat:no-repeat;background-position:center}
  .caprow .adv{color:var(--good);font-weight:700;font-size:13px;margin-left:4px}

  /* Board */
  .board-frame{position:relative;width:100%;aspect-ratio:1/1;border-radius:14px;overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.35);touch-action:manipulation}
  .board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);width:100%;height:100%}
  .sq{position:relative;display:flex;align-items:center;justify-content:center;user-select:none}
  .sq.light{background:var(--light)}
  .sq.dark{background:var(--dark)}
  .sq .piece{width:100%;height:100%;cursor:pointer;z-index:3;
    background-size:contain;background-repeat:no-repeat;background-position:center;
    transition:transform .06s}
  .sq .piece:active{transform:scale(1.06)}
  .sq.sel::after{content:"";position:absolute;inset:0;background:var(--sel);opacity:.5;z-index:1}
  .sq.last::after{content:"";position:absolute;inset:0;background:var(--last);z-index:0}
  .sq.check::before{content:"";position:absolute;inset:0;background:radial-gradient(circle,var(--check) 0%,transparent 72%);opacity:.85;z-index:1}
  .sq .hintdot{position:absolute;width:30%;height:30%;border-radius:50%;background:var(--move-dot);z-index:2}
  .sq .hintcap{position:absolute;inset:6%;border-radius:50%;border:4px solid var(--move-dot);z-index:2}
  .sq .goodmove{position:absolute;inset:0;border:4px solid var(--good);z-index:2;border-radius:2px}
  /* coordinates */
  .coord{position:absolute;font-size:9px;font-weight:700;z-index:2;opacity:.65}
  .coord.file{right:3px;bottom:1px}
  .coord.rank{left:3px;top:1px}
  .light .coord{color:var(--dark)}
  .dark .coord{color:var(--light)}

  /* Controls */
  .controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  button{font-family:inherit;font-size:14px;font-weight:600;color:var(--ink);
    background:var(--panel-2);border:1px solid var(--line);border-radius:12px;
    padding:12px 8px;cursor:pointer;transition:background .12s,opacity .12s;
    display:flex;align-items:center;justify-content:center;gap:6px}
  button:active{background:var(--accent-soft)}
  button:disabled{opacity:.4;cursor:default}
  button.primary{background:var(--accent);border-color:var(--accent)}
  .btn-wide{grid-column:1/-1}

  /* Settings drawer */
  .settings{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .settings summary{list-style:none;padding:14px;font-weight:700;font-size:15px;cursor:pointer;
    display:flex;align-items:center;justify-content:space-between}
  .settings summary::-webkit-details-marker{display:none}
  .settings summary .chev{color:var(--muted);transition:transform .2s}
  .settings[open] summary .chev{transform:rotate(180deg)}
  .settings .body{padding:0 14px 14px;display:flex;flex-direction:column;gap:2px}
  .row{display:flex;align-items:center;justify-content:space-between;padding:11px 2px;border-top:1px solid var(--line)}
  .row .label{font-size:14px;font-weight:500}
  .row .label small{display:block;color:var(--muted);font-size:11px;font-weight:400;margin-top:2px}
  /* toggle */
  .tg{width:46px;height:27px;border-radius:20px;background:var(--panel-2);border:1px solid var(--line);
    position:relative;cursor:pointer;flex:none;transition:background .15s}
  .tg::after{content:"";position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;
    background:var(--muted);transition:transform .15s,background .15s}
  .tg.on{background:var(--accent-soft)}
  .tg.on::after{transform:translateX(19px);background:var(--accent)}
  /* segmented */
  .seg{display:flex;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{border:0;border-radius:0;background:transparent;padding:8px 12px;font-size:13px;flex:1}
  .seg button.active{background:var(--accent);color:#fff}
  /* difficulty slider */
  .diff{padding:11px 2px;border-top:1px solid var(--line)}
  .diff .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .diff .name{font-weight:700;font-size:15px}
  .diff .elo{color:var(--muted);font-size:12px;font-weight:600}
  input[type=range]{width:100%;accent-color:var(--accent);height:6px}

  .footnote{text-align:center;color:var(--muted);font-size:11px;padding:2px 0 8px}

  /* Promotion / result modal */
  .overlay{position:fixed;inset:0;background:rgba(8,12,22,.72);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;width:100%;max-width:320px;text-align:center}
  .modal h2{font-size:20px;margin-bottom:6px}
  .modal p{color:var(--muted);font-size:14px;margin-bottom:18px}
  .promo{display:flex;gap:8px;justify-content:center}
  .promo button{font-size:32px;padding:10px;flex:1}
</style>
</head>
<body>
<div class="wrap">

  <div class="status" id="status">
    <span class="dot"></span>
    <div style="flex:1">
      <div class="msg" id="statusMsg">Your move</div>
    </div>
    <div class="sub" id="statusSub"></div>
  </div>

  <div class="caprow"><span id="capTop"></span></div>

  <div class="board-frame">
    <div class="board" id="board"></div>
  </div>

  <div class="caprow"><span id="capBot"></span></div>

  <div class="controls">
    <button id="undoBtn">↶ Undo</button>
    <button id="hintBtn">💡 Hint</button>
    <button id="flipBtn">⇅ Flip</button>
    <button class="primary btn-wide" id="newBtn">New Game</button>
    <button class="btn-wide" id="installBtn" style="display:none;background:var(--good);border-color:var(--good)">⬇ Install app to home screen</button>
  </div>

  <details class="settings" id="settings">
    <summary>Game Options <span class="chev">⌄</span></summary>
    <div class="body">

      <div class="diff">
        <div class="top">
          <span class="name" id="diffName">Intermediate</span>
          <span class="elo" id="diffElo">~1200 ELO</span>
        </div>
        <input type="range" id="diff" min="1" max="8" value="4">
      </div>

      <div class="row">
        <div class="label">Play as</div>
        <div class="seg" id="sideSeg">
          <button data-side="w" class="active">White</button>
          <button data-side="r">Random</button>
          <button data-side="b">Black</button>
        </div>
      </div>

      <div class="row"><div class="label">Show legal moves</div><div class="tg on" data-opt="legal"></div></div>
      <div class="row"><div class="label">Highlight last move</div><div class="tg on" data-opt="last"></div></div>
      <div class="row"><div class="label">King in check indicator</div><div class="tg on" data-opt="check"></div></div>
      <div class="row"><div class="label">Show coordinates</div><div class="tg on" data-opt="coords"></div></div>
      <div class="row"><div class="label">Allow undo</div><div class="tg on" data-opt="undo"></div></div>
      <div class="row"><div class="label">Allow hints</div><div class="tg on" data-opt="hints"></div></div>
      <div class="row"><div class="label">Always promote to queen<small>Off lets you choose the piece</small></div><div class="tg on" data-opt="autoq"></div></div>
    </div>
  </details>

  <div class="footnote">Stage 1 preview · offline · ad-free</div>
</div>

<!-- Promotion picker -->
<div class="overlay" id="promoOverlay">
  <div class="modal">
    <h2>Promote pawn</h2>
    <p>Choose a piece</p>
    <div class="promo" id="promoBtns"></div>
  </div>
</div>

<!-- Game over -->

const PIECE_URI = {};
for(const k in PIECE_SVG){ PIECE_URI[k]='data:image/svg+xml;utf8,'+encodeURIComponent(PIECE_SVG[k]); }

<script>
const game = new Chess();
const boardEl = document.getElementById('board');
const VAL = {p:1,n:3,b:3,r:5,q:9,k:0};

let opts = {legal:true,last:true,check:true,coords:true,undo:true,hints:true,autoq:true};
let humanSide = 'w';       // which colour the human plays
let orientation = 'w';     // which way the board faces
let selected = null;       // selected square e.g. 'e2'
let legalForSel = [];      // legal target squares for selected
let lastMove = null;       // {from,to}
let hintMove = null;       // {from,to} to draw
let busy = false;          // computer thinking / animating

const DIFF = [
  {name:'Beginner',    elo:'~600 ELO',  depth:1, rand:0.9},
  {name:'Casual',      elo:'~800 ELO',  depth:1, rand:0.6},
  {name:'Improver',    elo:'~1000 ELO', depth:2, rand:0.4},
  {name:'Intermediate',elo:'~1200 ELO', depth:2, rand:0.25},
  {name:'Skilled',     elo:'~1400 ELO', depth:3, rand:0.15},
  {name:'Tough',       elo:'~1600 ELO', depth:3, rand:0.07},
  {name:'Strong',      elo:'~1800 ELO', depth:4, rand:0.03},
  {name:'Expert',      elo:'~2000 ELO', depth:4, rand:0}
];
let diffIdx = 3;

/* ---------- rendering ---------- */
function squareName(r,c){ // r,c in board-draw order given orientation
  const files='abcdefgh';
  if(orientation==='w'){ return files[c]+(8-r); }
  else { return files[7-c]+(r+1); }
}
function render(){
  boardEl.innerHTML='';
  const inCheck = game.in_check();
  const checkColor = game.turn();
  for(let r=0;r<8;r++){
    for(let c=0;c<8;c++){
      const sq=squareName(r,c);
      const div=document.createElement('div');
      const fileIdx='abcdefgh'.indexOf(sq[0]);
      const rankIdx=parseInt(sq[1])-1;
      const isLight=(fileIdx+rankIdx)%2===1;
      div.className='sq '+(isLight?'light':'dark');
      div.dataset.sq=sq;

      if(selected===sq) div.classList.add('sel');
      if(opts.last && lastMove && (lastMove.from===sq||lastMove.to===sq)) div.classList.add('last');

      const pc=game.get(sq);
      if(opts.check && inCheck && pc && pc.type==='k' && pc.color===checkColor) div.classList.add('check');

      // coordinates
      if(opts.coords){
        const showFile = (orientation==='w'? r===7 : r===7);
        const showRank = (orientation==='w'? c===0 : c===0);
        if(showFile){const f=document.createElement('span');f.className='coord file';f.textContent=sq[0];div.appendChild(f);}
        if(showRank){const rk=document.createElement('span');rk.className='coord rank';rk.textContent=sq[1];div.appendChild(rk);}
      }

      // legal move markers
      if(opts.legal && selected && legalForSel.includes(sq)){
        const m=document.createElement('span');
        m.className = pc ? 'hintcap' : 'hintdot';
        div.appendChild(m);
      }
      // hint highlight
      if(hintMove && (hintMove.from===sq||hintMove.to===sq)){
        const g=document.createElement('span');g.className='goodmove';div.appendChild(g);
      }

      if(pc){
        const p=document.createElement('span');
        p.className='piece '+pc.color;
        p.style.backgroundImage='url("'+PIECE_URI[pc.color+pc.type]+'")';
        div.appendChild(p);
      }
      div.addEventListener('click',()=>onSquare(sq));
      boardEl.appendChild(div);
    }
  }
  renderCaptured();
}

function renderCaptured(){
  // compute material from board
  const cnt={w:{},b:{}};
  'pnbrq'.split('').forEach(t=>{cnt.w[t]=0;cnt.b[t]=0});
  for(const row of game.board()){
    for(const pc of row){ if(pc && pc.type!=='k') cnt[pc.color][pc.type]++; }
  }
  const start={p:8,n:2,b:2,r:2,q:1};
  function capturedBy(color){ // pieces this color has captured = opponent missing
    const opp=color==='w'?'b':'w';
    let s='';let score=0;
    for(const t of ['q','r','b','n','p']){
      const missing=start[t]-cnt[opp][t];
      for(let i=0;i<missing;i++){ s+=`<span class="cap" style="background-image:url('${PIECE_URI[opp+t]}')"></span>`; score+=VAL[t]; }
    }
    return {s,score};
  }
  const humanTop = orientation!==humanSide; // top row = opponent of orientation
  const topColor = orientation==='w'?'b':'w';
  const botColor = orientation;
  const top=capturedBy(topColor), bot=capturedBy(botColor);
  const diff=top.score-bot.score;
  document.getElementById('capTop').innerHTML = top.s + (diff>0?` <span class="adv">+${diff}</span>`:'');
  document.getElementById('capBot').innerHTML = bot.s + (diff<0?` <span class="adv">+${-diff}</span>`:'');
}

/* ---------- interaction ---------- */
function onSquare(sq){
  if(busy || game.game_over()) return;
  if(game.turn()!==humanSide) return;
  const pc=game.get(sq);
  hintMove=null;

  if(selected){
    if(legalForSel.includes(sq)){
      tryMove(selected,sq);
      return;
    }
    // reselect own piece
    if(pc && pc.color===humanSide){ selectSquare(sq); return; }
    selected=null;legalForSel=[];render();return;
  }
  if(pc && pc.color===humanSide){ selectSquare(sq); }
}
function selectSquare(sq){
  selected=sq;
  legalForSel=game.moves({square:sq,verbose:true}).map(m=>m.to);
  render();
}
function tryMove(from,to){
  const moves=game.moves({square:from,verbose:true}).filter(m=>m.to===to);
  const needsPromo=moves.some(m=>m.flags.includes('p'));
  if(needsPromo && !opts.autoq){
    showPromo(from,to);
    return;
  }
  const move=game.move({from,to,promotion:'q'});
  finishHumanMove(move);
}
function showPromo(from,to){
  const box=document.getElementById('promoBtns');
  box.innerHTML='';
  ['q','r','b','n'].forEach(t=>{
    const b=document.createElement('button');
    b.style.backgroundImage='url("'+PIECE_URI[humanSide+t]+'")';
    b.style.backgroundSize='contain';
    b.style.backgroundRepeat='no-repeat';
    b.style.backgroundPosition='center';
    b.style.height='56px';
    b.onclick=()=>{
      document.getElementById('promoOverlay').classList.remove('show');
      const move=game.move({from,to,promotion:t});
      finishHumanMove(move);
    };
    box.appendChild(b);
  });
  document.getElementById('promoOverlay').classList.add('show');
}
function finishHumanMove(move){
  if(!move)return;
  lastMove={from:move.from,to:move.to};
  selected=null;legalForSel=[];
  render();
  if(checkGameOver())return;
  setTimeout(computerMove,180);
}

/* ---------- computer ---------- */
function computerMove(){
  if(game.game_over())return;
  busy=true;setStatus();
  setTimeout(()=>{
    const d=DIFF[diffIdx];
    const best=pickMove(d);
    const move=game.move(best);
    lastMove={from:move.from,to:move.to};
    busy=false;
    render();
    checkGameOver();
    setStatus();
  },260);
}

// simple material + position search (minimax, shallow) with randomness for lower levels
const PST_PAWN=[0,0,0,0,0,0,0,0, 50,50,50,50,50,50,50,50, 10,10,20,30,30,20,10,10,
  5,5,10,25,25,10,5,5, 0,0,0,20,20,0,0,0, 5,-5,-10,0,0,-10,-5,5,
  5,10,10,-20,-20,10,10,5, 0,0,0,0,0,0,0,0];
function evalBoard(g){
  let score=0;
  const b=g.board();
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const pc=b[r][c];if(!pc)continue;
    let v=VAL[pc.type]*100;
    if(pc.type==='p'){const idx=pc.color==='w'?(r*8+c):((7-r)*8+c);v+=PST_PAWN[idx];}
    score+= pc.color==='w'? v : -v;
  }
  return score; // + favors white
}
function pickMove(d){
  const moves=game.moves({verbose:true});
  // randomness: sometimes just play a random legal move (weaker levels)
  if(Math.random()<d.rand){ return moves[Math.floor(Math.random()*moves.length)]; }
  const maximizing = game.turn()==='w';
  let best=null,bestScore=maximizing?-1e9:1e9;
  // light shuffle so equal moves vary
  for(let i=moves.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[moves[i],moves[j]]=[moves[j],moves[i]];}
  for(const m of moves){
    game.move(m);
    const val=minimax(d.depth-1,!maximizing,-1e9,1e9);
    game.undo();
    if(maximizing? val>bestScore : val<bestScore){bestScore=val;best=m;}
  }
  return best||moves[0];
}
function minimax(depth,maximizing,alpha,beta){
  if(depth===0||game.game_over()) return evalBoard(game);
  const moves=game.moves({verbose:true});
  if(maximizing){
    let max=-1e9;
    for(const m of moves){game.move(m);max=Math.max(max,minimax(depth-1,false,alpha,beta));game.undo();alpha=Math.max(alpha,max);if(beta<=alpha)break;}
    return max;
  }else{
    let min=1e9;
    for(const m of moves){game.move(m);min=Math.min(min,minimax(depth-1,true,alpha,beta));game.undo();beta=Math.min(beta,min);if(beta<=alpha)break;}
    return min;
  }
}

/* ---------- status / game over ---------- */
function setStatus(){
  const st=document.getElementById('status');
  const msg=document.getElementById('statusMsg');
  const sub=document.getElementById('statusSub');
  st.className='status';
  if(game.game_over()){st.classList.add('over');return;}
  if(busy){st.classList.add('think');msg.textContent='Computer is thinking…';sub.textContent=DIFF[diffIdx].name;return;}
  if(game.turn()===humanSide){msg.textContent='Your move';}
  else{msg.textContent='Computer to move';}
  sub.textContent = game.in_check()? 'Check!' : '';
}
function checkGameOver(){
  if(!game.game_over())return false;
  let title='Game over',text='';
  if(game.in_checkmate()){
    const winner=game.turn()==='w'?'Black':'White';
    title='Checkmate';
    text = (game.turn()!==humanSide)? 'You win! 🎉' : `${winner} wins`;
  }else if(game.in_stalemate()){title='Stalemate';text='Draw — no legal moves';}
  else if(game.in_threefold_repetition()){title='Draw';text='Threefold repetition';}
  else if(game.insufficient_material()){title='Draw';text='Insufficient material';}
  else if(game.in_draw()){title='Draw';text='50-move rule';}
  document.getElementById('overTitle').textContent=title;
  document.getElementById('overText').textContent=text;
  document.getElementById('overOverlay').classList.add('show');
  setStatus();
  return true;
}

/* ---------- controls ---------- */
function newGame(){
  game.reset();
  selected=null;legalForSel=[];lastMove=null;hintMove=null;busy=false;
  if(document.querySelector('#sideSeg .active').dataset.side==='r'){
    humanSide=Math.random()<0.5?'w':'b';
  }
  orientation=humanSide;
  render();setStatus();
  if(game.turn()!==humanSide) setTimeout(computerMove,300);
}
document.getElementById('newBtn').onclick=newGame;
document.getElementById('flipBtn').onclick=()=>{orientation=orientation==='w'?'b':'w';render();};
document.getElementById('undoBtn').onclick=()=>{
  if(!opts.undo||busy)return;
  // undo computer + human so it's human's move again
  if(game.history().length===0)return;
  game.undo();
  if(game.turn()!==humanSide && game.history().length>0) game.undo();
  const h=game.history({verbose:true});
  lastMove = h.length? {from:h[h.length-1].from,to:h[h.length-1].to} : null;
  selected=null;legalForSel=[];hintMove=null;
  render();setStatus();
};
document.getElementById('hintBtn').onclick=()=>{
  if(!opts.hints||busy||game.turn()!==humanSide||game.game_over())return;
  const m=pickMove(DIFF[7]); // strongest for hint quality
  if(m){hintMove={from:m.from,to:m.to};render();
    setTimeout(()=>{hintMove=null;render();},2200);}
};

// difficulty
const diffSlider=document.getElementById('diff');
diffSlider.oninput=()=>{
  diffIdx=parseInt(diffSlider.value)-1;
  document.getElementById('diffName').textContent=DIFF[diffIdx].name;
  document.getElementById('diffElo').textContent=DIFF[diffIdx].elo;
};

// side segmented
document.querySelectorAll('#sideSeg button').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('#sideSeg button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
  };
});

// toggles
document.querySelectorAll('.tg').forEach(t=>{
  t.onclick=()=>{
    const k=t.dataset.opt;
    opts[k]=!opts[k];
    t.classList.toggle('on',opts[k]);
    if(k==='undo')document.getElementById('undoBtn').disabled=!opts[k];
    if(k==='hints')document.getElementById('hintBtn').disabled=!opts[k];
    render();
  };
});

// init
render();setStatus();

  const blob=new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'});

    if(URL&&URL.createObjectURL){

  // Detect iOS (needs manual install via Share sheet)

  // Android/Chrome: capture the native install prompt
  window.addEventListener('beforeinstallprompt',(e)=>{
    e.preventDefault();

    if(!isStandalone) installBtn.style.display='';
  });

  window.addEventListener('appinstalled',()=>{
    installBtn.style.display='none';
    deferredPrompt=null;
  });

  installBtn.onclick=async()=>{
    if(deferredPrompt){
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;

        if(e.request.method==='GET' && resp.ok){c.put(e.request,resp.clone());}
        return resp;
      }).catch(()=>c.match('./')))
    )
  );
});`;
     const swBlob=new Blob([sw],{type:'text/javascript'});
     const swUrl=URL.createObjectURL(swBlob);
     navigator.serviceWorker.register(swUrl).catch(()=>{});
    }
   }catch(e){/* offline caching optional */}
  }
