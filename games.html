<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Games · Hatzing a Dynasty 26</title>
<meta name="theme-color" content="#1f4e79" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Games" />
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,600&family=Inter:wght@400;500;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:#faf7f2;color:#1c1a17;font-size:14px;min-height:100vh;}

.masthead{background:#f3f5f4;color:#214e75;padding:1.4rem 1rem;border-bottom:1px solid #e2dbd0;}
.masthead h1{font-family:'Playfair Display',serif;font-size:1.9rem;font-style:italic;color:#214e75;line-height:1.05;}
.masthead p{opacity:0.75;font-size:0.82rem;color:#214e75;margin-top:0.2rem;}

.wrap{max-width:640px;margin:0 auto;padding:1.2rem 1rem 3rem;}

.game-list{list-style:none;display:flex;flex-direction:column;gap:0.75rem;}
.game-link{display:flex;align-items:center;gap:0.9rem;text-decoration:none;background:#fff;border:1px solid #e2dbd0;border-left:4px solid #1f4e79;border-radius:10px;padding:0.95rem 1.1rem;color:#1c1a17;transition:transform .08s ease, box-shadow .12s ease;}
.game-link:hover,.game-link:active{transform:translateY(-1px);box-shadow:0 4px 14px rgba(31,78,121,0.14);}
.game-icon{font-size:1.6rem;line-height:1;flex-shrink:0;}
.game-title{font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:700;color:#214e75;}
.game-desc{font-size:0.78rem;opacity:0.7;margin-top:0.1rem;}

.back{display:inline-block;margin-top:1.6rem;font-size:0.82rem;color:#214e75;text-decoration:none;opacity:0.8;}
.back:hover{opacity:1;text-decoration:underline;}
</style>
</head>
<body>
<div class="masthead">
  <h1>Games</h1>
  <p>A little something for the long travel days</p>
</div>

<div class="wrap">
  <ul class="game-list" id="gameList"></ul>
  <a class="back" href="index.html">&larr; Back to the trip</a>
</div>

<script>
/* Add a new game by appending one entry below, then drop its .html file in the project root. */
var GAMES = [
  { title: 'Chess', href: 'chess.html', icon: '♞', desc: 'Play offline, one device' }
  // { title: 'Sudoku', href: 'sudoku.html', icon: '\u{1F522}', desc: 'Number puzzles' },
];

(function(){
  var list = document.getElementById('gameList');
  GAMES.forEach(function(g){
    var li = document.createElement('li');
    var a = document.createElement('a');
    a.className = 'game-link';
    a.href = g.href;
    a.innerHTML =
      '<span class="game-icon">' + g.icon + '</span>' +
      '<span><span class="game-title">' + g.title + '</span>' +
      (g.desc ? '<span class="game-desc">' + g.desc + '</span>' : '') +
      '</span>';
    li.appendChild(a);
    list.appendChild(li);
  });
})();
</script>
</body>
</html>
