<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Games · Hatzing a Dynasty 26</title>
<meta name="theme-color" content="#1f4e79" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Games" />
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,600&family=Inter:wght@400;500;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:#faf7f2;color:#1c1a17;font-size:14px;}

#games{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:2.2rem 1.2rem 3rem;text-align:center;}
#games h1{font-family:'Playfair Display',serif;font-style:italic;font-size:2rem;color:#214e75;line-height:1.05;margin-bottom:0.25rem;}
.games-sub{font-size:0.82rem;color:#214e75;opacity:0.72;margin-bottom:0.55rem;}
.games-q{font-size:0.7rem;text-transform:uppercase;letter-spacing:0.16em;color:#9a9a94;font-weight:700;margin:1.5rem 0 0.85rem;}

.game-grid{display:grid;grid-template-columns:1fr 1fr;gap:0.7rem;width:100%;max-width:440px;}
.game-tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.35rem;background:#fff;border:1.5px solid;border-radius:14px;padding:1.15rem 0.6rem;cursor:pointer;text-decoration:none;font-family:'Inter',sans-serif;transition:transform .15s ease,box-shadow .15s ease;box-shadow:0 1px 2px rgba(20,40,70,0.05);}
.game-tile:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(20,40,70,0.10);}
.gt-icon{font-size:2.4rem;line-height:1;}
.gt-img{width:56px;height:56px;border-radius:12px;display:block;}
.gt-name{font-size:0.85rem;font-weight:600;color:#214e75;}

.back{display:inline-block;margin-top:1.8rem;font-size:0.8rem;color:#214e75;text-decoration:none;opacity:0.75;}
.back:hover{opacity:1;text-decoration:underline;}
</style>
</head>
<body>
<div id="games">
  <h1>Games</h1>
  <div class="games-sub">Something for the long travel days</div>
  <div class="games-q">Pick a game</div>

  <div class="game-grid" id="gameGrid"></div>

  <a class="back" href="index.html">&larr; Back to the trip</a>
</div>

<script>
/* Add a game by appending one entry, then drop its .html in the project root.
   Use "img" for a logo image (data URI or file path), or "icon" for an emoji/glyph. */
var GAMES = [
  { name: 'Chess', href: 'chess.html', color: '#26324f',
    img: 'data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20512%20512%22%3E%3Crect%20width%3D%22512%22%20height%3D%22512%22%20rx%3D%2296%22%20fill%3D%22%2326324f%22/%3E%3Cg%20transform%3D%22translate%28106%2C96%29%20scale%286.7%29%22%20fill%3D%22none%22%20stroke%3D%22%23eef2fb%22%20stroke-width%3D%221.5%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M22%2010c10.5%201%2016.5%208%2016%2029H15c0-9%2010-6.5%208-21%22%20fill%3D%22%23eef2fb%22/%3E%3Cpath%20d%3D%22M24%2018c.38%202.91-5.55%207.37-8%209-3%202-2.82%204.34-5%204-1.042-.94%201.41-3.04%200-3-1%200%20.19%201.23-1%202-1%200-4.003%201-4-4%200-2%206-12%206-12s1.89-1.9%202-3.5c-.73-.994-.5-2-.5-3%201-1%203%202.5%203%202.5h2s.78-1.992%202.5-3c1%200%201%203%201%203%22%20fill%3D%22%23eef2fb%22/%3E%3Cpath%20d%3D%22M9.5%2025.5a.5.5%200%201%201-1%200%20.5.5%200%201%201%201%200zM14.933%2015.75a.5%201.5%2030%201%201-.866-.5.5%201.5%2030%201%201%20.866.5z%22%20fill%3D%22%2326324f%22%20stroke%3D%22%2326324f%22/%3E%3C/g%3E%3C/svg%3E' }
  // { name: 'Sudoku', href: 'sudoku.html', icon: '\u{1F522}', color: '#a07820' },
];

(function(){
  var grid = document.getElementById('gameGrid');
  GAMES.forEach(function(g){
    var a = document.createElement('a');
    a.className = 'game-tile';
    a.href = g.href;
    a.style.borderColor = g.color;
    var visual = g.img
      ? '<img class="gt-img" src="' + g.img + '" alt="' + g.name + ' logo">'
      : '<span class="gt-icon" style="color:' + g.color + '">' + g.icon + '</span>';
    a.innerHTML = visual + '<span class="gt-name">' + g.name + '</span>';
    grid.appendChild(a);
  });
})();
</script>
</body>
</html>
